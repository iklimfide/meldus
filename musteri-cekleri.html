<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Müşteri Çekleri | İklim Fide</title>
  <meta name="description" content="Müşteri çekleri listesi (Google E-Tablolar)." />
  <!-- Hassas iş verisi olabilir; indekslemeyi kapattık. SEO isterseniz content'i index, follow yapın. -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="resimler/logo.png" />
  <link rel="stylesheet" href="output.css" />
  <style>
    :root { --marul: #2d5a27; }
    .stickybar {
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    .sheet-wrap {
      min-height: calc(100vh - 120px);
    }
    .sheet-wrap iframe {
      display: block;
      width: 100%;
      min-height: 75vh;
      border: 0;
      background: #fff;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900">
  <header class="stickybar">
    <div class="mx-auto max-w-6xl px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <a href="/" class="inline-flex items-center gap-2 text-lg font-black tracking-tight text-[color:var(--marul)]">
        <img src="resimler/logo.png" alt="" class="h-7 w-auto" width="100" height="100" />
        İKLİM FİDE
      </a>
      <nav class="text-sm font-semibold flex flex-wrap gap-4">
        <a class="text-zinc-600 hover:text-[color:var(--marul)]" href="/">Ana sayfa</a>
        <a
          class="text-zinc-600 hover:text-[color:var(--marul)]"
          href="https://docs.google.com/spreadsheets/d/e/2PACX-1vTI3StnCW368r6YBjVzhXZ9rVBcy1t9ZB1mEqeOfJFsEgNBzvzFXTbQ35Wa2uNY8A/pubhtml?gid=842234945&single=true"
          target="_blank"
          rel="noopener noreferrer"
        >Tam ekran (Google’da aç)</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-[1600px] px-2 sm:px-4 py-4">
    <h1 class="visually-hidden">Müşteri çekleri</h1>
    <p class="mb-3 text-sm text-zinc-600 px-1">
      Veriler Google E-Tablolar üzerinden yüklenir; güncellemeler otomatik yansır.
    </p>
    <div class="sheet-wrap rounded-xl overflow-hidden border border-zinc-200 shadow-sm">
      <iframe
        title="Müşteri çekleri tablosu"
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTI3StnCW368r6YBjVzhXZ9rVBcy1t9ZB1mEqeOfJFsEgNBzvzFXTbQ35Wa2uNY8A/pubhtml?gid=842234945&single=true"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>
  </main>
</body>
</html>
